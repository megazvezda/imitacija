[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "imitacija"
version = "0.1.0"
description = "Transient healthy astronaut and independent cabin telemetry generator"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.12.5"]

[project.scripts]
imitacija = "imitacija.main:main"

[dependency-groups]
dev = ["pytest==8.4.2", "mypy==1.18.2", "ruff==0.14.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
